version: '3.8'

services:
  # Single Node - Validator
  call-dev-node-single:
    image: callchain/call-core:latest
    container_name: call-dev-node-single
    hostname: call-dev-node-single
    volumes:
      - ./node-single/data:/data/node-single
      - ./node-single/config.toml:/app/config.toml
    ports:
      - "5005:5005"   # RPC
      - "51235:51235" # P2P
    command: ["--config", "/app/config.toml", "start"]
    networks:
      call-devnet-single:
        ipv4_address: 172.22.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/", "-H", "Content-Type: application/json", "-d", '{"jsonrpc":"2.0","method":"ping","id":1}']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  call-devnet-single:
    driver: bridge
    name: call-devnet-single
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
