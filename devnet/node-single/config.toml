# Call-core Single Node Configuration
# Dev Testnet - Single Node Setup for Transaction Testing

# Node identity
node_name = "call-dev-node-single"

# P2P network settings
# Listen on all interfaces, port 51235
listen_address = "0.0.0.0:51235"

# No bootstrap peers - single node mode
peers = []

# Data directory for blockchain storage
data_dir = "/data/node-single"

# Validator configuration
# This node is a validator with a deterministic seed for testing
validation_seed = "sEdTLQ75P2X9VBbNqGihzrNWGtE7d6NHPmgSG8q5d8fM7YjHcXK"

# Peer connection limits
max_peers = 50
target_peers = 0

# RPC server configuration
rpc_enabled = true
rpc_bind_address = "0.0.0.0"
rpc_port = 5005

# Enable admin RPC methods (for devnet testing)
rpc_admin_enabled = true

# Logging
log_level = "info"
