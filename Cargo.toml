[workspace]
members = [
    "crates/primitives",
    "crates/serialization",
    "crates/crypto",
    "crates/shamap",
    "crates/storage",
    "crates/protocol",
    "crates/consensus",
    "crates/network",
    "crates/node",
    "tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/callchain/call-core"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
ed25519-dalek = "2.1"
secp256k1 = { version = "0.28", features = ["global-context", "recovery"] }
rocksdb = "0.21"
prost = "0.12"
bytes = "1.5"
byteorder = "1.5"
chrono = "0.4"
async-trait = "0.1"
futures = "0.3"
tower = "0.4"
hyper = { version = "1.0", features = ["full"] }
http = "1.0"
axum = "0.7"
tower-http = "0.5"
proptest = "1.4"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
